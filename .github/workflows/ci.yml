name: CI

# Tests only. This workflow builds nothing for publication, signs nothing, uploads no artifact, creates no tag and no release.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine and CLI (Windows, Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity for the tests that make commits in temporary repositories
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: python -m pytest -q -p no:cacheprovider
      - run: python -m modularcv privacy --root .

  desktop:
    name: Desktop (Windows, full verification)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Rust toolchain (stable, MSVC)
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Git identity for the tests that make commits in temporary repositories
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: npm ci
        working-directory: desktop
      # Engine suite, adapter suite, privacy scanner, front end (typecheck, unit tests, build), PyInstaller engine build,
      # packaged-engine tests, Rust tests and clippy. No LaTeX is installed here: the tests that need pdflatex skip themselves.
      - name: desktop/verify.ps1
        shell: pwsh
        run: ./desktop/verify.ps1 -Python python
