[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "modularcv"
version = "0.1.0"
description = "Modular, traceable, fact-first workflow and guard rails for CVs and cover letters."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["modularcv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
